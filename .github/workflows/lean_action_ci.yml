name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Lean
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # lakefile.toml and lean-toolchain must be at the repository root.
      # BilevelLowerBoundLean/ contains source modules, not a nested Lake project.
      - name: Build Lean project and audit modules
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          auto-config: "false"
          build: "true"
          build-args: >-
            BilevelLowerBoundLean
            BilevelLowerBoundLean.KappaEightImportSmokeTest
            BilevelLowerBoundLean.KappaEightAudit
            BilevelLowerBoundLean.KappaEightCompleteAudit
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"

      - name: Check Mathlib smoke test
        run: lake env lean SmokeTest.lean

      - name: Audit paper-facing declarations
        run: lake env lean BilevelLowerBoundLean/KappaEightAudit.lean

      - name: Audit all loaded project theorems
        run: lake env lean BilevelLowerBoundLean/KappaEightCompleteAudit.lean
