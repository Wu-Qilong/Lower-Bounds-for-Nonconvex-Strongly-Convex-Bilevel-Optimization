name = "kappa8-stochastic-bilevel-lower-bound-lean"
version = "1.0.0"
keywords = ["math", "bilevel-optimization", "lower-bound", "kappa8"]
defaultTargets = ["BilevelLowerBoundLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "BilevelLowerBoundLean"
